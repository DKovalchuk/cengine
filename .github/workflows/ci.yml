name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (shared + static)
        run: make

      - name: C tests
        run: make test

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install numpy pytest

      - name: Python tests
        run: python -m pytest tests/ -q

      - name: Packaging smoke test
        run: |
          python -m venv /tmp/cengine-smoke-venv
          /tmp/cengine-smoke-venv/bin/pip install .
          cd "$RUNNER_TEMP"
          /tmp/cengine-smoke-venv/bin/python -c "
          import os
          from cengine import bindings
          assert bindings.lib is not None, 'installed package cannot load libcengine.so'
          pkg_dir = os.path.dirname(os.path.abspath(bindings.__file__))
          so = os.path.join(pkg_dir, 'libcengine.so')
          assert os.path.isfile(so), f'missing packaged library: {so}'
          bindings.check(bindings.lib.ce_init())
          print('packaging smoke ok:', so)
          "
